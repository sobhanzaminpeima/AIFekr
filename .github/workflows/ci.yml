name: CI

on:
  push:
    branches: [main, "codex/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: "ci-test-secret-not-for-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "AIFekr CI"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: node_modules/.bin/tsc --noEmit

      - name: Run tests
        run: npm test
        continue-on-error: true  # remove once test files exist

      - name: Build
        run: npm run build
